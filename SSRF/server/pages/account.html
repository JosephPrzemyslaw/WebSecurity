<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your account — Member shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/delete-account.js" defer></script>
  </head>
  <body>
    <main class="members account-page">
      <section class="panel">
        <p class="eyebrow">SSTI lab</p>
        <!-- NAV -->
        <h1>Your account</h1>
        <p class="account-intro">Profile details for your signed-in reader account.</p>
        <dl class="profile-card">
          <div>
            <dt>Login</dt>
            <dd><!-- LOGIN --></dd>
          </div>
        </dl>
        <!-- PROFILE_BIO -->
        <!-- SHIPPING_LABEL -->
        <section class="avatar-section">
          <h2 class="avatar-section__title">Profile photo</h2>
          <p class="blurb">Upload a profile image. It is stored under <code>/uploads</code> and shown here.</p>
          <p class="error" <!-- UPLOAD_ERROR -->>Upload failed. Try a smaller file.</p>
          <!-- AVATAR_PREVIEW -->
          <form class="avatar-form" method="post" action="/account/avatar" enctype="multipart/form-data">
            <div class="field">
              <label for="avatar">Choose file</label>
              <input id="avatar" name="avatar" type="file" required />
            </div>
            <button class="submit submit--compact" type="submit">Upload</button>
          </form>
        </section>
        <!-- DELETE -->
      </section>
    </main>
  </body>
</html>
