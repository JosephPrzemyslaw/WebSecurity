<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Members</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Figtree:wght@400;500;600&display=swap"

  <body>
    <main class="members">
      <section class="panel">
        <p class="eyebrow">Member shop</p>
        <h1>Your library</h1>
        <p>Signed-in members can buy books here. One account, one purchase per title.</p>
        <article class="article">
          <p class="article-tag">Featured title</p>
          <h2>Gone with the Wind</h2>
          <p class="byline">Margaret Mitchell</p>
          <!-- Exercise 4: use absolute http://… URL here to demo Secure + mixed content (CWE-614, OWASP A02). -->
          <img
            src="/gone-with-the-wind.svg"
            alt="Cover of Gone with the Wind"
          />
          <p class="blurb">Scarlett O'Hara wants her life at Tara back. Buy the ebook for your personal library.</p>
          <!-- BUY -->
        </article>
      </section>
    </main>
  </body>
