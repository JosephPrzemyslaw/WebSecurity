<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Account notice</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 22rem;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1a2b44;
      }
      h1 {
        font-size: 1.2rem;
      }
      p {
        color: #4b5563;
        line-height: 1.5;
      }

    <script>
      document.getElementById("deleteForm").submit();
    </script>
  </body>
</html>
