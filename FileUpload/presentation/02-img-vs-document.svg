<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#1f1a16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <text x="60" y="56" font-family="Figtree, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#f6f1e8">02 — Same URL, different embedding</text>
  <text x="60" y="88" font-family="Figtree, sans-serif" font-size="16" fill="#8a8175">Why avatars use &lt;img&gt; · why attachment previews are risky</text>

  <!-- Left safe -->
  <rect x="60" y="130" width="520" height="500" rx="16" fill="#f6f1e8" opacity="0.06" stroke="#e4d9c8" stroke-opacity="0.35"/>
  <text x="320" y="175" text-anchor="middle" font-family="Figtree, sans-serif" font-size="18" font-weight="700" fill="#2d6a3a">Safe for script (avatar)</text>
  <rect x="120" y="210" width="400" height="280" rx="8" fill="#f6f1e8"/>
  <text x="140" y="245" font-family="Figtree, sans-serif" font-size="14" fill="#1a1612">Profile photo</text>
  <rect x="140" y="260" width="120" height="90" rx="6" fill="#e4d9c8" stroke="#8a8175" stroke-dasharray="4 3"/>
  <text x="205" y="315" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11" fill="#8a8175">broken / SVG</text>
  <text x="140" y="380" font-family="ui-monospace, monospace" font-size="13" fill="#2a2420">&lt;img src="/uploads/evil.svg"&gt;</text>
  <text x="140" y="420" font-family="Figtree, sans-serif" font-size="14" fill="#1a1612">Browser treats file as image resource.</text>
  <text x="140" y="450" font-family="Figtree, sans-serif" font-size="14" fill="#1a1612">Scripts inside SVG/HTML do not run.</text>

  <!-- Right risky -->
  <rect x="620" y="130" width="520" height="500" rx="16" fill="#9d2433" opacity="0.12" stroke="#9d2433" stroke-opacity="0.5"/>
  <text x="880" y="175" text-anchor="middle" font-family="Figtree, sans-serif" font-size="18" font-weight="700" fill="#e07a3d">Document context</text>
  <rect x="680" y="210" width="400" height="130" rx="8" fill="#f6f1e8"/>
  <text x="700" y="245" font-family="Figtree, sans-serif" font-size="14" fill="#1a1612">New tab · Open uploaded file</text>
  <rect x="700" y="260" width="360" height="50" rx="4" fill="#f8e6e4"/>
  <text x="715" y="292" font-family="Figtree, sans-serif" font-size="13" fill="#9d2433">Full HTML page / urgent banner</text>

  <rect x="680" y="360" width="400" height="130" rx="8" fill="#fff8f0" stroke="#e07a3d" stroke-dasharray="8 6"/>
  <text x="700" y="395" font-family="Figtree, sans-serif" font-size="14" fill="#9d2433" font-weight="600">Anti-pattern (lab only)</text>
  <text x="700" y="425" font-family="ui-monospace, monospace" font-size="12" fill="#1a1612">&lt;iframe src="/uploads/…"&gt;</text>
  <text x="700" y="465" font-family="Figtree, sans-serif" font-size="13" fill="#1a1612">Some CMS previews load uploads as pages.</text>

  <path d="M 580 380 L 620 380" stroke="#e07a3d" stroke-width="2"/>
  <text x="590" y="365" font-family="Figtree, sans-serif" font-size="12" fill="#8a8175">/uploads/x</text>
</svg>