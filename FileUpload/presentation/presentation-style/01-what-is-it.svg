<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <linearGradient id="gServer" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f4fc"/><stop offset="100%" stop-color="#fff"/></linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="100" cy="80" rx="190" ry="140" fill="#ffc9d9" opacity="0.52" filter="url(#blur)"/>
  <ellipse cx="1780" cy="100" rx="170" ry="130" fill="#b8f0dd" opacity="0.48" filter="url(#blur)"/>
  <ellipse cx="90" cy="950" rx="150" ry="110" fill="#fff0b3" opacity="0.55" filter="url(#blur)"/>
  <ellipse cx="1820" cy="920" rx="160" ry="120" fill="#c5e4ff" opacity="0.5" filter="url(#blur)"/>
  <text x="1740" y="140" font-size="24" fill="#e8c85a">✦</text>
  <g fill="#d0d0d8" opacity="0.8"><circle cx="200" cy="880" r="3"/><circle cx="218" cy="898" r="2"/><circle cx="1680" cy="200" r="2"/></g>

  <text x="960" y="115" text-anchor="middle" font-family="Figtree, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#1e2a3a">What is a file upload vulnerability?</text>
  <text x="960" y="168" text-anchor="middle" font-family="Figtree, sans-serif" font-size="28" font-weight="700" fill="#5a6a7a">CWE-434 · unrestricted upload of a dangerous file</text>

  <rect x="280" y="200" width="1360" height="64" rx="32" fill="#ffe8ee" stroke="#e8a0b0" stroke-width="2"/>
  <text x="960" y="242" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" font-weight="600" fill="#1e2a3a">The server accepts a file it should refuse — and that file becomes reachable over HTTP</text>

  <!-- Illustration: user → upload → server -->
  <g transform="translate(200, 300)">
    <circle cx="60" cy="50" r="42" fill="#e07a3d" opacity="0.25"/>
    <circle cx="60" cy="40" r="18" fill="#1e2a3a"/>
    <path d="M25 95 Q60 70 95 95" fill="#1e2a3a"/>
    <rect x="130" y="25" width="120" height="90" rx="10" fill="#fff" stroke="#7eb8e8" stroke-width="2"/>
    <path d="M150 95 L170 55 L190 75 L210 45 L230 95 Z" fill="#c5e4ff" stroke="#7eb8e8"/>
    <text x="250" y="60" font-family="Figtree, sans-serif" font-size="22" fill="#7eb8e8">→</text>
    <rect x="300" y="15" width="200" height="110" rx="12" fill="url(#gServer)" stroke="#7eb8e8" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="330" y="35" width="140" height="12" rx="3" fill="#7eb8e8" opacity="0.4"/>
    <rect x="330" y="55" width="100" height="10" rx="2" fill="#8a8175" opacity="0.3"/>
    <text x="400" y="100" text-anchor="middle" font-family="Figtree, sans-serif" font-size="14" fill="#5a6a7a">/uploads/</text>
  </g>

  <text x="960" y="460" text-anchor="middle" font-family="Figtree, sans-serif" font-size="30" font-weight="700" fill="#1e2a3a">In one sentence: a bad file lands on disk — someone opens it later</text>
  <text x="960" y="500" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#5a6a7a">The form is only step one · the damage depends on what happens after save</text>

  <!-- 4 impact tiles with icons -->
  <rect x="120" y="540" width="400" height="210" rx="22" fill="#fff" stroke="#e8a0b0" stroke-width="2"/>
  <path d="M200 590 L230 620 L280 570" stroke="#9d2433" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="320" cy="600" r="36" fill="#fdeaea"/>
  <text x="320" y="608" text-anchor="middle" font-family="Figtree, sans-serif" font-size="18" font-weight="700" fill="#9d2433">RCE</text>
  <text x="320" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#1e2a3a">Code runs on the</text>
  <text x="320" y="688" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#1e2a3a">server (e.g. PHP)</text>

  <rect x="540" y="540" width="400" height="210" rx="22" fill="#fff" stroke="#e8c85a" stroke-width="2"/>
  <rect x="620" y="575" width="100" height="70" rx="6" fill="#fff" stroke="#1e2a3a"/>
  <circle cx="635" cy="590" r="4" fill="#c44"/><circle cx="655" cy="590" r="4" fill="#e8c85a"/><circle cx="675" cy="590" r="4" fill="#6bc9a0"/>
  <text x="740" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" font-weight="700" fill="#c47a00">XSS / phishing</text>
  <text x="740" y="692" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">HTML opened in victim browser</text>

  <rect x="960" y="540" width="400" height="210" rx="22" fill="#fff" stroke="#7eb8e8" stroke-width="2"/>
  <rect x="1060" y="580" width="200" height="24" rx="4" fill="#7eb8e8" opacity="0.35"/>
  <rect x="1060" y="612" width="200" height="24" rx="4" fill="#7eb8e8" opacity="0.25"/>
  <rect x="1060" y="644" width="140" height="24" rx="4" fill="#7eb8e8" opacity="0.2"/>
  <text x="1160" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" font-weight="700" fill="#1e2a3a">DoS</text>
  <text x="1160" y="692" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">Disk full · too many files</text>

  <rect x="1380" y="540" width="400" height="210" rx="22" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
  <rect x="1480" y="585" width="90" height="65" rx="4" fill="#f0faf5" stroke="#6bc9a0"/>
  <path d="M1525 610 L1550 585 L1585 610 L1575 640 L1475 640 L1465 610 Z" fill="#6bc9a0" opacity="0.4"/>
  <text x="1580" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" font-weight="700" fill="#2d6a3a">Defacement</text>
  <text x="1580" y="692" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">Overwrite or fake pages</text>

  <rect x="120" y="780" width="1680" height="96" rx="22" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <circle cx="175" cy="828" r="36" fill="#1e2a3a"/>
  <path d="M175 808 Q175 795 188 795 Q201 795 201 808 L201 818 Q201 831 188 831 Q175 831 175 818 Z M168 838 L208 838 L203 848 L173 848 Z" fill="#f6f1e8"/>
  <text x="230" y="835" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lesson: the threat is not the upload button — it is who can open the saved file and how</text>
</svg>