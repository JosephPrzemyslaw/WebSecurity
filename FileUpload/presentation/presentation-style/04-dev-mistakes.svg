<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <text x="120" y="100" font-family="Figtree, sans-serif" font-size="50" font-weight="700" fill="#1e2a3a">Common developer mistakes</text>
  <text x="120" y="150" font-family="Figtree, sans-serif" font-size="26" fill="#5a6a7a">“Accept everything” or “check only one thing”</text>

  <rect x="120" y="175" width="1100" height="50" rx="25" fill="#ffe8ee" stroke="#e8a0b0" stroke-width="2"/>
  <text x="140" y="208" font-family="Figtree, sans-serif" font-size="21" font-weight="600" fill="#1e2a3a">Blocklists (.php forbidden) lose to bypasses — use an allow-list</text>

  <g font-family="Figtree, sans-serif">
    <rect x="120" y="260" width="1680" height="105" rx="18" fill="#fff" stroke="#e8a0b0" stroke-width="2"/>
    <circle cx="175" cy="312" r="30" fill="#fdeaea"/><text x="175" y="320" text-anchor="middle" fill="#9d2433" font-size="26" font-weight="700">✕</text>
    <text x="230" y="305" font-size="27" font-weight="700" fill="#1e2a3a">No allow-list of file types</text>
    <text x="230" y="345" font-size="22" fill="#5a6a7a">Whatever the browser sends gets written to disk</text>

    <rect x="120" y="385" width="1680" height="105" rx="18" fill="#fff" stroke="#e8a0b0" stroke-width="2"/>
    <circle cx="175" cy="437" r="30" fill="#fdeaea"/><text x="175" y="445" text-anchor="middle" fill="#9d2433" font-size="26" font-weight="700">✕</text>
    <text x="230" y="430" font-size="27" font-weight="700" fill="#1e2a3a">Trusting multipart Content-Type</text>
    <text x="230" y="470" font-size="22" fill="#5a6a7a">Burp can say image/jpeg while body is HTML</text>

    <rect x="120" y="510" width="1680" height="105" rx="18" fill="#fff" stroke="#e8a0b0" stroke-width="2"/>
    <circle cx="175" cy="562" r="30" fill="#fdeaea"/><text x="175" y="570" text-anchor="middle" fill="#9d2433" font-size="26" font-weight="700">✕</text>
    <text x="230" y="555" font-size="27" font-weight="700" fill="#1e2a3a">Keeping the user’s filename</text>
    <text x="230" y="595" font-size="22" fill="#5a6a7a">Path traversal · predictable URLs</text>

    <rect x="120" y="635" width="1680" height="105" rx="18" fill="#fff" stroke="#e8a0b0" stroke-width="2"/>
    <circle cx="175" cy="687" r="30" fill="#fdeaea"/><text x="175" y="695" text-anchor="middle" fill="#9d2433" font-size="26" font-weight="700">✕</text>
    <text x="230" y="680" font-size="27" font-weight="700" fill="#1e2a3a">Same host as session cookies</text>
    <text x="230" y="720" font-size="22" fill="#5a6a7a">User content + auth cookies = easier phishing and XSS</text>
  </g>

  <rect x="120" y="770" width="1680" height="260" rx="24" fill="#f4f9ff" stroke="#7eb8e8" stroke-width="2"/>
  <text x="960" y="830" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" fill="#5a6a7a">Visual metaphor</text>
  <g transform="translate(400, 850)">
    <rect x="0" y="0" width="200" height="140" rx="10" fill="#fff" stroke="#e8a0b0" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="100" y="75" text-anchor="middle" font-family="Figtree, sans-serif" font-size="16" fill="#9d2433">Open door</text>
    <text x="260" y="80" font-size="40" fill="#1e2a3a">→</text>
    <rect x="320" y="0" width="200" height="140" rx="10" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
    <text x="420" y="75" text-anchor="middle" font-family="Figtree, sans-serif" font-size="16" fill="#2d6a3a">Locked types +</text>
    <text x="420" y="100" text-anchor="middle" font-family="Figtree, sans-serif" font-size="16" fill="#2d6a3a">new name</text>
    <text x="580" y="80" font-size="40" fill="#1e2a3a">→</text>
    <rect x="640" y="0" width="200" height="140" rx="10" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
    <text x="740" y="75" text-anchor="middle" font-family="Figtree, sans-serif" font-size="16" fill="#1e2a3a">Separate zone</text>
  </g>

  <rect x="120" y="960" width="1680" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="1012" font-family="Figtree, sans-serif" font-size="25" font-weight="700" fill="#1e2a3a">Lesson: you need several independent controls — one gate is never enough</text>
</svg>