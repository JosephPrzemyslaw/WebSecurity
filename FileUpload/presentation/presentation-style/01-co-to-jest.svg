<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs><filter id="b"><feGaussianBlur stdDeviation="45"/></filter></defs>
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="90" cy="90" rx="200" ry="150" fill="#ffc9d9" opacity="0.55" filter="url(#b)"/>
  <ellipse cx="1820" cy="120" rx="180" ry="140" fill="#b8f0dd" opacity="0.5" filter="url(#b)"/>
  <ellipse cx="1780" cy="980" rx="200" ry="150" fill="#c5e4ff" opacity="0.5" filter="url(#b)"/>
  <ellipse cx="100" cy="950" rx="150" ry="110" fill="#fff0b3" opacity="0.55" filter="url(#b)"/>
  <text x="1710" y="130" font-size="26" fill="#e8c85a">✦</text>
  <text x="140" y="220" font-size="20" fill="#d8d8e0">✦</text>

  <text x="960" y="120" text-anchor="middle" font-family="Figtree, Segoe UI, sans-serif" font-size="54" font-weight="700" fill="#1e2a3a">Co to jest podatność uploadu?</text>
  <text x="960" y="180" text-anchor="middle" font-family="Figtree, sans-serif" font-size="30" font-weight="700" fill="#5a6a7a">CWE-434 · unrestricted upload of dangerous file</text>

  <rect x="260" y="220" width="1400" height="72" rx="36" fill="#ffe8ee" stroke="#e8a0b0" stroke-width="2"/>
  <text x="960" y="265" text-anchor="middle" font-family="Figtree, sans-serif" font-size="26" font-weight="600" fill="#1e2a3a">Serwer przyjmuje plik od użytkownika i pozwala go później pobrać przez internet</text>

  <rect x="200" y="330" width="1520" height="140" rx="28" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <text x="960" y="395" text-anchor="middle" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#1e2a3a">W skrócie: zły plik ląduje na serwerze — i ktoś go otworzy</text>
  <text x="960" y="440" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" fill="#5a6a7a">To nie musi być „hak” w samym formularzu; chodzi o to, co dzieje się PO zapisie</text>

  <!-- 4 tiles -->
  <rect x="120" y="510" width="400" height="200" rx="22" fill="#fff" stroke="#e8a0b0" stroke-width="2"/>
  <text x="320" y="570" text-anchor="middle" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#9d2433">RCE</text>
  <text x="320" y="620" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#1e2a3a">Kod wykonuje się</text>
  <text x="320" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">na serwerze (np. PHP)</text>

  <rect x="540" y="510" width="400" height="200" rx="22" fill="#fff" stroke="#e8c85a" stroke-width="2"/>
  <text x="740" y="570" text-anchor="middle" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#c47a00">XSS / phishing</text>
  <text x="740" y="620" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#1e2a3a">HTML otwarty</text>
  <text x="740" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">w przeglądarce ofiary</text>

  <rect x="960" y="510" width="400" height="200" rx="22" fill="#fff" stroke="#7eb8e8" stroke-width="2"/>
  <text x="1160" y="570" text-anchor="middle" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">DoS</text>
  <text x="1160" y="620" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#1e2a3a">Za duże / za dużo</text>
  <text x="1160" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">plików = pełny dysk</text>

  <rect x="1380" y="510" width="400" height="200" rx="22" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
  <text x="1580" y="570" text-anchor="middle" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#2d6a3a">Podmiana</text>
  <text x="1580" y="620" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#1e2a3a">Nadpisanie strony</text>
  <text x="1580" y="655" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">lub pliku w webroot</text>

  <rect x="120" y="760" width="1680" height="100" rx="22" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="822" font-family="Figtree, sans-serif" font-size="28" font-weight="700" fill="#1e2a3a">Wniosek: upload to wejście — groźba zależy od tego, KTO i JAK otworzy zapisany plik</text>
</svg>