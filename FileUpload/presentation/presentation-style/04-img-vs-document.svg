<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="1700" cy="200" rx="140" ry="100" fill="#fff0b3" opacity="0.55"/>
  <ellipse cx="150" cy="150" rx="130" ry="95" fill="#b8f0dd" opacity="0.5"/>

  <text x="960" y="105" text-anchor="middle" font-family="Figtree, sans-serif" font-size="46" font-weight="700" fill="#1e2a3a">Same file · different embedding</text>
  <text x="960" y="152" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" font-weight="700" fill="#1e2a3a">Why production avatars use &lt;img&gt; only</text>

  <rect x="120" y="220" width="820" height="520" rx="28" fill="#fff" stroke="#6bc9a0" stroke-width="3"/>
  <text x="530" y="280" text-anchor="middle" font-family="Figtree, sans-serif" font-size="30" font-weight="700" fill="#2d6a3a">Image context</text>
  <rect x="200" y="320" width="280" height="200" rx="16" fill="#f0faf5" stroke="#6bc9a0" stroke-dasharray="8 6"/>
  <text x="340" y="430" text-anchor="middle" font-family="Figtree, sans-serif" font-size="15" fill="#5a6a7a">SVG/HTML as pixels</text>
  <text x="160" y="560" font-family="ui-monospace, monospace" font-size="18" fill="#1e2a3a">&lt;img src="/uploads/file"&gt;</text>
  <text x="160" y="610" font-family="Figtree, sans-serif" font-size="20" fill="#1e2a3a">Scripts do not run (by design)</text>
  <text x="160" y="660" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">Lab profile photo block</text>

  <rect x="980" y="220" width="820" height="520" rx="28" fill="#fff" stroke="#e8a0b0" stroke-width="3"/>
  <text x="1390" y="280" text-anchor="middle" font-family="Figtree, sans-serif" font-size="30" font-weight="700" fill="#9d2433">Document context</text>
  <rect x="1060" y="320" width="360" height="90" rx="14" fill="#fff8f0" stroke="#e8c85a"/>
  <text x="1085" y="360" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">Open uploaded file · new tab</text>
  <rect x="1060" y="430" width="360" height="90" rx="14" fill="#ffe8ee" stroke="#e8a0b0" stroke-dasharray="8 6"/>
  <text x="1085" y="455" font-family="Figtree, sans-serif" font-size="16" font-weight="600" fill="#9d2433">Anti-pattern iframe (lab)</text>
  <text x="1085" y="490" font-family="Figtree, sans-serif" font-size="15" fill="#5a6a7a">attachment preview in CMS</text>
  <text x="1020" y="560" font-family="Figtree, sans-serif" font-size="20" fill="#1e2a3a">HTML/SVG runs in the browser</text>
  <text x="1020" y="610" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">Trusted origin · phishing / script</text>

  <rect x="120" y="780" width="1680" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="832" font-family="Figtree, sans-serif" font-size="25" font-weight="700" fill="#1e2a3a">Lesson: unsafe upload + document embedding = client impact even when the avatar looks harmless</text>
</svg>