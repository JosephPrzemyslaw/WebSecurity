<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="100" cy="100" rx="160" ry="120" fill="#ffc9d9" opacity="0.5" filter="url(#blur)"/><ellipse cx="1820" cy="1000" rx="180" ry="130" fill="#b8f0dd" opacity="0.45" filter="url(#blur)"/>
  <defs><filter id="blur"><feGaussianBlur stdDeviation="35"/></filter></defs>

  <text x="120" y="100" font-family="Figtree, Segoe UI, sans-serif" font-size="50" font-weight="700" fill="#1e2a3a">File upload prevention in practice</text>
  <text x="120" y="155" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#1e2a3a">allowlist · rename · content check · isolation</text>

  <rect x="120" y="185" width="720" height="50" rx="25" fill="#ffe8ee" stroke="#e8a0b0" stroke-width="2"/>
  <text x="140" y="218" font-family="Figtree, sans-serif" font-size="19" font-weight="600" fill="#1e2a3a">MIME from the browser is not validation by itself (lab exercise 4)</text>

  <!-- Blue box -->
  <rect x="120" y="280" width="1680" height="220" rx="24" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <circle cx="175" cy="340" r="36" fill="#e8f4fc" stroke="#7eb8e8" stroke-width="2"/>
  <text x="175" y="352" text-anchor="middle" font-size="32">🔍</text>
  <text x="240" y="330" font-family="Figtree, sans-serif" font-size="28" font-weight="700" fill="#1e2a3a">Entry checks</text>
  <text x="240" y="365" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">only types we truly need — jpeg/png for avatars</text>
  <text x="240" y="410" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">✓ Allow-list MIME + extension (USE_SAFE_UPLOAD in lab)</text>
  <text x="240" y="445" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">✓ Max file size · reject empty parts</text>
  <text x="240" y="480" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">✓ Server-side random name · strip path from originalname</text>

  <path d="M 960 520 L 960 560" stroke="#1e2a3a" stroke-width="6" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1e2a3a"/></marker></defs>

  <!-- Yellow box -->
  <rect x="120" y="580" width="1680" height="220" rx="24" fill="#fffef5" stroke="#e8c85a" stroke-width="3"/>
  <circle cx="175" cy="640" r="36" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="175" y="652" text-anchor="middle" font-size="28">🖌</text>
  <text x="240" y="630" font-family="Figtree, sans-serif" font-size="28" font-weight="700" fill="#1e2a3a">Content &amp; delivery</text>
  <text x="240" y="665" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">treat every upload as untrusted bytes</text>
  <text x="240" y="710" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">✓ Magic-byte / file-type library — not multipart header alone</text>
  <text x="240" y="745" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">✓ Re-encode images (strip EXIF) · avatar = &lt;img&gt; only</text>
  <text x="240" y="780" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">✓ Host downloads on separate domain · no execution in upload dir</text>

  <rect x="120" y="850" width="1680" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="902" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lesson: validate on the way in; verify content; never run uploads as code on the server</text>
</svg>