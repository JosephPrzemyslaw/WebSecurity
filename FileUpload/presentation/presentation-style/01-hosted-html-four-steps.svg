<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img">
  <defs>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <!-- BG -->
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="120" cy="120" rx="180" ry="140" fill="#ffc9d9" opacity="0.55" filter="url(#softBlur)"/>
  <ellipse cx="1780" cy="80" rx="200" ry="150" fill="#b8f0dd" opacity="0.5" filter="url(#softBlur)"/>
  <ellipse cx="1850" cy="950" rx="220" ry="160" fill="#c5e4ff" opacity="0.55" filter="url(#softBlur)"/>
  <ellipse cx="80" cy="900" rx="160" ry="120" fill="#fff0b3" opacity="0.6" filter="url(#softBlur)"/>
  <text x="1700" y="120" font-size="28" fill="#f0c040">✦</text>
  <text x="200" y="200" font-size="22" fill="#d0d0d8">✦</text>
  <circle cx="250" cy="850" r="4" fill="#c0c0c8"/><circle cx="270" cy="870" r="3" fill="#c0c0c8"/><circle cx="1680" cy="180" r="3" fill="#c0c0c8"/>

  <!-- Title -->
  <text x="960" y="115" text-anchor="middle" font-family="Figtree, Segoe UI, sans-serif" font-size="48" font-weight="700" fill="#1e2a3a">File upload · hosted document on shop origin</text>
  <text x="960" y="165" text-anchor="middle" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Member shop lab · CWE-434 · client-side impact</text>

  <!-- Callout -->
  <rect x="560" y="195" width="800" height="52" rx="26" fill="#ffe8ee" stroke="#e8a0b0" stroke-width="2"/>
  <text x="960" y="230" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" font-weight="600" fill="#1e2a3a">The avatar preview is not the attack — Open uploaded file is</text>

  <!-- 4 steps -->
  <g font-family="Figtree, sans-serif">
    <!-- Step 1 blue -->
    <rect x="80" y="290" width="400" height="420" rx="24" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
    <circle cx="130" cy="335" r="28" fill="#7eb8e8"/><text x="130" y="343" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text>
  </g>
  <text x="110" y="400" font-family="Figtree, sans-serif" font-size="22" font-weight="700" fill="#1e2a3a">Upload</text>
  <rect x="110" y="420" width="340" height="100" rx="12" fill="#f4f9ff" stroke="#7eb8e8"/>
  <text x="130" y="460" font-family="ui-monospace, monospace" font-size="16" fill="#1e2a3a">POST /account/avatar</text>
  <text x="130" y="490" font-family="ui-monospace, monospace" font-size="15" fill="#c44">evil.html</text>
  <text x="110" y="560" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">STEP 1 Blue — marc uploads</text>
  <text x="110" y="590" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">Server keeps original name under</text>
  <text x="110" y="618" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">/uploads</text>

  <path d="M490 500 L530 500" stroke="#1e2a3a" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1e2a3a"/></marker></defs>

  <!-- Step 2 green -->
  <rect x="540" y="290" width="400" height="420" rx="24" fill="#fff" stroke="#6bc9a0" stroke-width="3"/>
  <circle cx="590" cy="335" r="28" fill="#6bc9a0"/><text x="590" y="343" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
  <text x="570" y="400" font-family="Figtree, sans-serif" font-size="22" font-weight="700" fill="#1e2a3a">Preview</text>
  <rect x="570" y="420" width="340" height="90" rx="12" fill="#f0faf5" stroke="#6bc9a0"/>
  <text x="590" y="455" font-family="Figtree, sans-serif" font-size="16" fill="#1e2a3a">&lt;img src="/uploads/evil.html"&gt;</text>
  <text x="590" y="485" font-family="Figtree, sans-serif" font-size="15" fill="#5a6a7a">broken image · no script</text>
  <text x="570" y="560" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">STEP 2 Green — safe avatar UI</text>
  <text x="570" y="590" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">Lab iframe block = do not ship</text>

  <path d="M950 500 L990 500" stroke="#1e2a3a" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 3 yellow -->
  <rect x="1000" y="290" width="400" height="420" rx="24" fill="#fff" stroke="#e8c85a" stroke-width="3"/>
  <circle cx="1050" cy="335" r="28" fill="#e8c85a"/><text x="1050" y="343" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
  <text x="1030" y="400" font-family="Figtree, sans-serif" font-size="22" font-weight="700" fill="#1e2a3a">Open file</text>
  <rect x="1030" y="420" width="340" height="100" rx="12" fill="#fffbf0" stroke="#e8c85a"/>
  <text x="1050" y="460" font-family="ui-monospace, monospace" font-size="16" fill="#1e2a3a">GET /uploads/evil.html</text>
  <text x="1050" y="490" font-family="Figtree, sans-serif" font-size="15" fill="#5a6a7a">new tab or shared link</text>
  <text x="1030" y="560" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">STEP 3 Yellow — document context</text>

  <path d="M1410 500 L1450 500" stroke="#1e2a3a" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 4 purple -->
  <rect x="1460" y="290" width="400" height="420" rx="24" fill="#fff" stroke="#b89ae0" stroke-width="3"/>
  <circle cx="1510" cy="335" r="28" fill="#b89ae0"/><text x="1510" y="343" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text>
  <text x="1490" y="400" font-family="Figtree, sans-serif" font-size="22" font-weight="700" fill="#1e2a3a">Impact</text>
  <rect x="1490" y="420" width="340" height="70" rx="12" fill="#f8e6e4" stroke="#c44"/>
  <text x="1510" y="462" font-family="Figtree, sans-serif" font-size="16" font-weight="600" fill="#9d2433">Urgent banner · same origin</text>
  <text x="1490" y="560" font-family="Figtree, sans-serif" font-size="17" fill="#1e2a3a">STEP 4 Purple — trust in URL</text>
  <text x="1490" y="590" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">Express serves static · no PHP RCE</text>

  <!-- Lesson -->
  <rect x="80" y="760" width="1760" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <circle cx="140" cy="804" r="32" fill="#1e2a3a"/>
  <text x="140" y="812" text-anchor="middle" font-size="28">🛡</text>
  <text x="200" y="812" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lesson: block bad uploads; never treat user files as documents on your shop origin</text>
</svg>