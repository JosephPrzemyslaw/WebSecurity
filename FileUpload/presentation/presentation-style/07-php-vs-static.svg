<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <text x="960" y="105" text-anchor="middle" font-family="Figtree, sans-serif" font-size="48" font-weight="700" fill="#1e2a3a">Ten sam upload — inna technologia → inny skutek</text>
  <text x="960" y="152" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" fill="#5a6a7a">Dlaczego Portswigger pokazuje .php, a Node „tylko” serwuje plik</text>

  <rect x="100" y="200" width="800" height="560" rx="28" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <text x="500" y="270" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="700" fill="#1e2a3a">Tylko „wydaj plik”</text>
  <text x="500" y="310" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#5a6a7a">Node / static / S3 + CDN</text>
  <text x="140" y="390" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">GET = zwróć bajty</text>
  <text x="140" y="440" font-family="Figtree, sans-serif" font-size="26" fill="#2d6a3a">Ryzyko głównie:</text>
  <text x="160" y="490" font-family="Figtree, sans-serif" font-size="24" fill="#1e2a3a">• phishing / XSS w przeglądarce</text>
  <text x="160" y="535" font-family="Figtree, sans-serif" font-size="24" fill="#1e2a3a">• śmieci na dysku</text>
  <text x="160" y="580" font-family="Figtree, sans-serif" font-size="24" fill="#1e2a3a">• malware pobrany „z zaufanej strony”</text>
  <rect x="140" y="620" width="720" height="56" rx="10" fill="#e8f4fc"/>
  <text x="160" y="658" font-family="Figtree, sans-serif" font-size="20" fill="#1e2a3a">Interpreter NIE uruchamia uploadu</text>

  <rect x="1020" y="200" width="800" height="560" rx="28" fill="#fff" stroke="#9d2433" stroke-width="3"/>
  <text x="1420" y="270" text-anchor="middle" font-family="Figtree, sans-serif" font-size="34" font-weight="700" fill="#9d2433">„Uruchom plik”</text>
  <text x="1420" y="310" text-anchor="middle" font-family="Figtree, sans-serif" font-size="22" fill="#5a6a7a">PHP / CGI w katalogu www</text>
  <text x="1060" y="390" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">GET = silnik wykonuje kod</text>
  <text x="1060" y="440" font-family="Figtree, sans-serif" font-size="26" fill="#9d2433">Ryzyko głównie:</text>
  <text x="1080" y="490" font-family="Figtree, sans-serif" font-size="24" fill="#1e2a3a">• RCE — polecenia na serwerze</text>
  <text x="1080" y="535" font-family="Figtree, sans-serif" font-size="24" fill="#1e2a3a">• odczyt sekretów poza webroot</text>
  <text x="1080" y="580" font-family="Figtree, sans-serif" font-size="24" fill="#1e2a3a">• pełne przejęcie maszyny</text>
  <rect x="1060" y="620" width="720" height="56" rx="10" fill="#fdeaea"/>
  <text x="1080" y="658" font-family="ui-monospace, monospace" font-size="18" fill="#1e2a3a">GET /uploads/shell.php</text>

  <rect x="120" y="800" width="1680" height="100" rx="22" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="860" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lekcja: oceniaj upload zawsze razem ze stackiem WWW — „czy ten plik MOŻE być wykonany?”</text>
</svg>