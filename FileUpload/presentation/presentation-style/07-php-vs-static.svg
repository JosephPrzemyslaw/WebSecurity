<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <text x="960" y="102" text-anchor="middle" font-family="Figtree, sans-serif" font-size="46" font-weight="700" fill="#1e2a3a">Same upload mistake · different technology</text>
  <text x="960" y="148" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" fill="#5a6a7a">Why PortSwigger uses .php · why static hosts behave differently</text>

  <rect x="100" y="190" width="820" height="580" rx="28" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <text x="510" y="260" text-anchor="middle" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#1e2a3a">Static delivery</text>
  <text x="510" y="300" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">Node · S3 + CDN · nginx file only</text>
  <g transform="translate(160, 340)">
    <rect x="0" y="0" width="280" height="180" rx="10" fill="#f4f9ff" stroke="#7eb8e8"/>
    <text x="140" y="90" text-anchor="middle" font-family="Figtree, sans-serif" font-size="48" fill="#7eb8e8" font-weight="700">GET</text>
    <text x="140" y="130" text-anchor="middle" fill="#5a6a7a" font-size="18">returns bytes</text>
    <text x="320" y="100" font-size="40" fill="#1e2a3a">≠</text>
    <rect x="380" y="40" width="280" height="100" rx="8" fill="#1e2a3a"/>
    <text x="520" y="95" text-anchor="middle" fill="#f6f1e8" font-family="ui-monospace" font-size="16">execute()</text>
  </g>
  <text x="140" y="580" font-family="Figtree, sans-serif" font-size="22" fill="#2d6a3a" font-weight="600">Typical impact:</text>
  <text x="160" y="620" font-family="Figtree, sans-serif" font-size="21" fill="#1e2a3a">• Browser attacks (XSS, phishing)</text>
  <text x="160" y="660" font-family="Figtree, sans-serif" font-size="21" fill="#1e2a3a">• Garbage on disk · malware download</text>

  <rect x="1000" y="190" width="820" height="580" rx="28" fill="#fff" stroke="#9d2433" stroke-width="3"/>
  <text x="1410" y="260" text-anchor="middle" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#9d2433">Interpreter in web dir</text>
  <text x="1410" y="300" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">PHP · CGI · misconfigured Apache</text>
  <g transform="translate(1060, 340)">
    <rect x="0" y="0" width="280" height="180" rx="10" fill="#fdeaea" stroke="#9d2433"/>
    <text x="140" y="85" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" font-weight="700" fill="#9d2433">GET shell.php</text>
    <text x="140" y="120" text-anchor="middle" font-family="ui-monospace" font-size="14" fill="#1e2a3a">stdout = command</text>
    <path d="M320 90 L380 90" stroke="#9d2433" stroke-width="4" marker-end="url(#r)"/>
    <defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#9d2433"/></marker></defs>
    <ellipse cx="520" cy="90" rx="100" ry="70" fill="#9d2433" opacity="0.15" stroke="#9d2433"/>
    <text x="520" y="98" text-anchor="middle" font-family="Figtree, sans-serif" font-size="16" fill="#9d2433">SERVER</text>
  </g>
  <text x="1040" y="580" font-family="Figtree, sans-serif" font-size="22" fill="#9d2433" font-weight="600">Typical impact:</text>
  <text x="1060" y="620" font-family="Figtree, sans-serif" font-size="21" fill="#1e2a3a">• Remote code execution</text>
  <text x="1060" y="660" font-family="Figtree, sans-serif" font-size="21" fill="#1e2a3a">• Read files outside web root</text>

  <rect x="120" y="800" width="1680" height="96" rx="22" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="858" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lesson: always ask — can this URL ever be executed by the platform, not only downloaded?</text>
</svg>