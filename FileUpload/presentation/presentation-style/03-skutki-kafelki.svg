<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="1840" cy="920" rx="140" ry="100" fill="#fff0b3" opacity="0.5"/>

  <text x="960" y="110" text-anchor="middle" font-family="Figtree, sans-serif" font-size="50" font-weight="700" fill="#1e2a3a">Co może się stać? (4 skutki)</text>
  <text x="960" y="162" text-anchor="middle" font-family="Figtree, sans-serif" font-size="26" fill="#5a6a7a">OWASP · Intigriti — zależy od aplikacji i serwera WWW</text>

  <rect x="140" y="210" width="800" height="280" rx="24" fill="#fff" stroke="#9d2433" stroke-width="3"/>
  <text x="540" y="280" text-anchor="middle" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#9d2433">Pełne przejęcie serwera (RCE)</text>
  <text x="180" y="340" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• Wrzucony „web shell” (.php)</text>
  <text x="180" y="385" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• Otwarcie linku = wykonanie kodu</text>
  <text x="180" y="430" font-family="Figtree, sans-serif" font-size="22" fill="#5a6a7a">Wymaga: interpreter w katalogu uploadu</text>

  <rect x="980" y="210" width="800" height="280" rx="24" fill="#fff" stroke="#e8c85a" stroke-width="3"/>
  <text x="1380" y="280" text-anchor="middle" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#c47a00">Atak na użytkownika (XSS)</text>
  <text x="1020" y="340" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• HTML / SVG jako strona</text>
  <text x="1020" y="385" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• Zaufany adres (twoja domena)</text>
  <text x="1020" y="430" font-family="Figtree, sans-serif" font-size="22" fill="#5a6a7a">Skrypt działa w przeglądarce ofiary</text>

  <rect x="140" y="520" width="800" height="280" rx="24" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <text x="540" y="590" text-anchor="middle" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#1e2a3a">Zapchanie zasobów (DoS)</text>
  <text x="180" y="650" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• Brak limitu rozmiaru / liczby</text>
  <text x="180" y="695" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• Dysk lub baza pełne → aplikacja pada</text>

  <rect x="980" y="520" width="800" height="280" rx="24" fill="#fff" stroke="#6bc9a0" stroke-width="3"/>
  <text x="1380" y="590" text-anchor="middle" font-family="Figtree, sans-serif" font-size="32" font-weight="700" fill="#2d6a3a">Fałszywa treść (phishing)</text>
  <text x="1020" y="650" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• Podmieniona strona „oficjalna”</text>
  <text x="1020" y="695" font-family="Figtree, sans-serif" font-size="26" fill="#1e2a3a">• Kradzież haseł / danych karty</text>

  <rect x="120" y="830" width="1680" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="885" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lekcja: jeden bug uploadu — wiele scenariuszy; oceniaj stack (PHP, Node, S3…)</text>
</svg>