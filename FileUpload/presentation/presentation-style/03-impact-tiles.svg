<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="120" cy="120" rx="140" ry="100" fill="#ffc9d9" opacity="0.45"/>

  <text x="960" y="105" text-anchor="middle" font-family="Figtree, sans-serif" font-size="50" font-weight="700" fill="#1e2a3a">What can go wrong? (4 impacts)</text>
  <text x="960" y="155" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" fill="#5a6a7a">OWASP · Intigriti — depends on app code and web server config</text>

  <rect x="120" y="200" width="820" height="300" rx="24" fill="#fff" stroke="#9d2433" stroke-width="3"/>
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="#1e2a3a"/>
    <text x="70" y="58" text-anchor="middle" fill="#f6f1e8" font-family="ui-monospace" font-size="14">&gt;_</text>
    <path d="M160 50 L220 80 L160 110" fill="none" stroke="#9d2433" stroke-width="4"/>
    <rect x="230" y="20" width="450" height="80" rx="8" fill="#fdeaea" stroke="#9d2433"/>
    <text x="250" y="55" font-family="Figtree, sans-serif" font-size="22" fill="#9d2433" font-weight="700">Remote code execution</text>
    <text x="250" y="85" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">Web shell · read secrets outside web root</text>
  </g>
  <text x="150" y="430" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">Needs: script engine in upload directory (e.g. PHP)</text>

  <rect x="980" y="200" width="820" height="300" rx="24" fill="#fff" stroke="#e8c85a" stroke-width="3"/>
  <g transform="translate(1060, 250)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#fff" stroke="#1e2a3a"/>
    <circle cx="30" cy="25" r="5" fill="#c44"/><circle cx="55" cy="25" r="5" fill="#e8c85a"/><circle cx="80" cy="25" r="5" fill="#6bc9a0"/>
    <rect x="20" y="45" width="120" height="40" rx="4" fill="#f8e6e4"/>
    <text x="250" y="55" font-family="Figtree, sans-serif" font-size="22" fill="#c47a00" font-weight="700">Cross-site scripting</text>
    <text x="250" y="85" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">Trusted domain hosts HTML/SVG as a page</text>
  </g>

  <rect x="120" y="530" width="820" height="300" rx="24" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <g transform="translate(200, 580)">
    <rect x="0" y="0" width="120" height="140" rx="6" fill="#7eb8e8" opacity="0.3"/>
    <rect x="20" y="20" width="80" height="20" rx="3" fill="#7eb8e8"/>
    <rect x="20" y="50" width="80" height="20" rx="3" fill="#7eb8e8" opacity="0.7"/>
    <rect x="20" y="80" width="80" height="20" rx="3" fill="#7eb8e8" opacity="0.5"/>
    <text x="200" y="70" font-family="Figtree, sans-serif" font-size="22" fill="#1e2a3a" font-weight="700">Denial of service</text>
    <text x="200" y="105" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">Huge files · unlimited count · full disk</text>
  </g>

  <rect x="980" y="530" width="820" height="300" rx="24" fill="#fff" stroke="#6bc9a0" stroke-width="3"/>
  <g transform="translate(1060, 580)">
    <rect x="0" y="0" width="100" height="120" rx="6" fill="#f0faf5" stroke="#6bc9a0"/>
    <path d="M20 95 L50 40 L80 70 L95 50 L100 95 Z" fill="#6bc9a0" opacity="0.5"/>
    <text x="200" y="70" font-family="Figtree, sans-serif" font-size="22" fill="#2d6a3a" font-weight="700">Phishing / defacement</text>
    <text x="200" y="105" font-family="Figtree, sans-serif" font-size="18" fill="#5a6a7a">Fake login on your hostname</text>
  </g>

  <rect x="120" y="860" width="1680" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="915" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lesson: one upload bug — many storylines · always ask what stack does with the file</text>
</svg>