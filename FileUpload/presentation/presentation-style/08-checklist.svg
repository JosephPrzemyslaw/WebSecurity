<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="1780" cy="200" rx="130" ry="100" fill="#b8f0dd" opacity="0.45"/>

  <text x="960" y="105" text-anchor="middle" font-family="Figtree, sans-serif" font-size="50" font-weight="700" fill="#1e2a3a">Upload feature checklist</text>
  <text x="960" y="152" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" fill="#5a6a7a">Six yes/no questions for devs and testers</text>

  <g font-family="Figtree, sans-serif">
    <rect x="180" y="210" width="1560" height="88" rx="16" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
    <circle cx="235" cy="254" r="26" fill="#6bc9a0"/><path d="M222 254 L232 264 L248 244" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="290" y="262" font-size="26" fill="#1e2a3a">Allow-list extensions/MIME — not a block-list?</text>

    <rect x="180" y="315" width="1560" height="88" rx="16" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
    <circle cx="235" cy="359" r="26" fill="#6bc9a0"/><path d="M222 359 L232 369 L248 349" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="290" y="367" font-size="26" fill="#1e2a3a">Magic bytes or re-encoded images?</text>

    <rect x="180" y="420" width="1560" height="88" rx="16" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
    <circle cx="235" cy="464" r="26" fill="#6bc9a0"/><path d="M222 464 L232 474 L248 454" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="290" y="472" font-size="26" fill="#1e2a3a">Random server-side name (no user path)?</text>

    <rect x="180" y="525" width="1560" height="88" rx="16" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
    <circle cx="235" cy="569" r="26" fill="#6bc9a0"/><path d="M222 569 L232 579 L248 559" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="290" y="577" font-size="26" fill="#1e2a3a">No script execution in the upload directory?</text>

    <rect x="180" y="630" width="1560" height="88" rx="16" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
    <circle cx="235" cy="674" r="26" fill="#6bc9a0"/><path d="M222 674 L232 684 L248 664" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="290" y="682" font-size="26" fill="#1e2a3a">Session cookies not sent to user-content domain?</text>

    <rect x="180" y="735" width="1560" height="88" rx="16" fill="#fff" stroke="#6bc9a0" stroke-width="2"/>
    <circle cx="235" cy="779" r="26" fill="#6bc9a0"/><path d="M222 779 L232 789 L248 769" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="290" y="787" font-size="26" fill="#1e2a3a">Plan to delete stale files after tightening rules?</text>
  </g>

  <g transform="translate(750, 850)">
    <circle cx="210" cy="80" r="70" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
    <path d="M210 45 L210 65 M190 85 L230 85 M210 95 L210 115" stroke="#1e2a3a" stroke-width="3"/>
    <text x="210" y="200" text-anchor="middle" font-family="Figtree, sans-serif" font-size="20" fill="#5a6a7a">One “no” → revisit threat model (CWE-434)</text>
  </g>

  <rect x="120" y="880" width="1680" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="932" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lesson: shipping upload without this list is shipping arbitrary write to your infrastructure</text>
</svg>