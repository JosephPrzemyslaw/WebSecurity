<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="1820" cy="150" rx="150" ry="110" fill="#c5e4ff" opacity="0.45"/>

  <text x="960" y="105" text-anchor="middle" font-family="Figtree, sans-serif" font-size="48" font-weight="700" fill="#1e2a3a">How testers bypass weak controls</text>
  <text x="960" y="152" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" fill="#5a6a7a">Practical methodology · extension · MIME · path · polyglot</text>

  <rect x="100" y="195" width="410" height="320" rx="22" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <circle cx="155" cy="245" r="28" fill="#7eb8e8"/><text x="155" y="253" text-anchor="middle" fill="#fff" font-weight="700" font-size="22">1</text>
  <text x="305" y="250" text-anchor="middle" font-family="Figtree, sans-serif" font-size="23" font-weight="700" fill="#1e2a3a">Alt extension</text>
  <g transform="translate(130, 280)">
    <rect x="0" y="0" width="350" height="80" rx="10" fill="#f4f9ff" stroke="#7eb8e8"/>
    <text x="25" y="35" font-family="ui-monospace" font-size="20" fill="#1e2a3a">shell.phtml</text>
    <text x="25" y="65" font-family="Figtree, sans-serif" font-size="17" fill="#5a6a7a">Bypasses “.php blocked”</text>
  </g>

  <rect x="530" y="195" width="410" height="320" rx="22" fill="#fff" stroke="#6bc9a0" stroke-width="3"/>
  <circle cx="585" cy="245" r="28" fill="#6bc9a0"/><text x="585" y="253" text-anchor="middle" fill="#fff" font-weight="700" font-size="22">2</text>
  <text x="735" y="250" text-anchor="middle" font-family="Figtree, sans-serif" font-size="23" font-weight="700" fill="#1e2a3a">Double ext.</text>
  <g transform="translate(560, 280)">
    <rect x="0" y="0" width="350" height="80" rx="10" fill="#f0faf5" stroke="#6bc9a0"/>
    <text x="25" y="35" font-family="ui-monospace" font-size="18" fill="#1e2a3a">report.jpg.php</text>
    <text x="25" y="65" font-family="Figtree, sans-serif" font-size="17" fill="#5a6a7a">Check reads wrong end</text>
  </g>

  <rect x="960" y="195" width="410" height="320" rx="22" fill="#fff" stroke="#e8c85a" stroke-width="3"/>
  <circle cx="1015" cy="245" r="28" fill="#e8c85a"/><text x="1015" y="253" text-anchor="middle" fill="#fff" font-weight="700" font-size="22">3</text>
  <text x="1165" y="250" text-anchor="middle" font-family="Figtree, sans-serif" font-size="23" font-weight="700" fill="#1e2a3a">MIME spoof</text>
  <g transform="translate(990, 280)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#1e2a3a"/>
    <text x="80" y="55" text-anchor="middle" fill="#6bc9a0" font-family="Figtree, sans-serif" font-size="14" font-weight="700">BURP</text>
    <text x="190" y="45" font-family="Figtree, sans-serif" font-size="16" fill="#1e2a3a">Body: HTML</text>
    <text x="190" y="75" font-family="Figtree, sans-serif" font-size="16" fill="#2d6a3a">Header: image/jpeg</text>
  </g>

  <rect x="1390" y="195" width="410" height="320" rx="22" fill="#fff" stroke="#b89ae0" stroke-width="3"/>
  <circle cx="1445" cy="245" r="28" fill="#b89ae0"/><text x="1445" y="253" text-anchor="middle" fill="#fff" font-weight="700" font-size="22">4</text>
  <text x="1595" y="250" text-anchor="middle" font-family="Figtree, sans-serif" font-size="23" font-weight="700" fill="#1e2a3a">Path in name</text>
  <g transform="translate(1420, 280)">
    <rect x="0" y="0" width="350" height="80" rx="10" fill="#f8f4fc" stroke="#b89ae0"/>
    <text x="25" y="40" font-family="ui-monospace" font-size="16" fill="#9d2433">../../sensitive.cfg</text>
    <text x="25" y="68" font-family="Figtree, sans-serif" font-size="17" fill="#5a6a7a">Write outside upload dir</text>
  </g>

  <rect x="200" y="540" width="1520" height="240" rx="24" fill="#fff" stroke="#7eb8e8" stroke-width="2"/>
  <text x="960" y="595" text-anchor="middle" font-family="Figtree, sans-serif" font-size="28" font-weight="700" fill="#1e2a3a">Polyglot (advanced)</text>
  <g transform="translate(400, 620)">
    <rect x="0" y="0" width="280" height="140" rx="10" fill="#f4f9ff" stroke="#7eb8e8"/>
    <circle cx="140" cy="70" r="50" fill="#c5e4ff" opacity="0.6"/>
    <text x="140" y="78" text-anchor="middle" font-size="12" fill="#1e2a3a">JPEG</text>
    <text x="310" y="60" font-size="36" fill="#1e2a3a">+</text>
    <rect x="370" y="20" width="280" height="100" rx="10" fill="#fdeaea" stroke="#9d2433"/>
    <text x="510" y="78" text-anchor="middle" font-family="Figtree, sans-serif" font-size="18" fill="#9d2433">HTML/JS inside</text>
    <text x="700" y="75" font-size="36" fill="#1e2a3a">=</text>
    <text x="760" y="85" font-family="Figtree, sans-serif" font-size="20" fill="#1e2a3a">Passes bytes check · still hostile when served as document</text>
  </g>

  <rect x="120" y="810" width="1680" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="170" y="862" font-family="Figtree, sans-serif" font-size="26" font-weight="700" fill="#1e2a3a">Lesson: test like an attacker — proxy, rename, mutate headers, not only “pick file in UI”</text>
</svg>