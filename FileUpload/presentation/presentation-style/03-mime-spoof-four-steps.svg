<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#fafbfd"/>
  <ellipse cx="90" cy="980" rx="150" ry="110" fill="#c5e4ff" opacity="0.5"/>
  <ellipse cx="1820" cy="120" rx="170" ry="120" fill="#ffc9d9" opacity="0.45"/>

  <text x="960" y="110" text-anchor="middle" font-family="Figtree, sans-serif" font-size="46" font-weight="700" fill="#1e2a3a">MIME spoof — whitelist bypass</text>
  <text x="960" y="158" text-anchor="middle" font-family="Figtree, sans-serif" font-size="24" font-weight="700" fill="#1e2a3a">Lab exercise 4 · garbage on disk · UI still looks fine</text>

  <rect x="460" y="185" width="1000" height="48" rx="24" fill="#ffe8ee" stroke="#e8a0b0" stroke-width="2"/>
  <text x="960" y="218" text-anchor="middle" font-family="Figtree, sans-serif" font-size="19" font-weight="600" fill="#1e2a3a">Broken &lt;img&gt; is not success — inspect public/uploads on disk</text>

  <!-- Step row -->
  <rect x="60" y="270" width="410" height="380" rx="22" fill="#fff" stroke="#7eb8e8" stroke-width="3"/>
  <circle cx="110" cy="315" r="26" fill="#7eb8e8"/><text x="110" y="323" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
  <text x="85" y="370" font-family="Figtree, sans-serif" font-size="20" font-weight="700" fill="#1e2a3a">Safe mode on</text>
  <text x="85" y="430" font-family="Figtree, sans-serif" font-size="16" fill="#1e2a3a">evil.html in form</text>
  <text x="85" y="470" font-family="Figtree, sans-serif" font-size="17" fill="#9d2433" font-weight="600">Upload failed ✗</text>
  <text x="85" y="540" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">STEP 1 — students relax</text>

  <text x="490" y="460" font-size="36" fill="#1e2a3a">→</text>

  <rect x="530" y="270" width="410" height="380" rx="22" fill="#fff" stroke="#6bc9a0" stroke-width="3"/>
  <circle cx="580" cy="315" r="26" fill="#6bc9a0"/><text x="580" y="323" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
  <text x="555" y="370" font-family="Figtree, sans-serif" font-size="20" font-weight="700" fill="#1e2a3a">Burp</text>
  <rect x="555" y="395" width="360" height="80" rx="10" fill="#f0faf5" stroke="#6bc9a0"/>
  <text x="575" y="428" font-family="ui-monospace, monospace" font-size="14" fill="#1e2a3a">Content-Type:</text>
  <text x="575" y="455" font-family="ui-monospace, monospace" font-size="14" fill="#2d6a3a">image/jpeg</text>
  <text x="555" y="540" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">STEP 2 — forged part header</text>

  <text x="960" y="460" font-size="36" fill="#1e2a3a">→</text>

  <rect x="1000" y="270" width="410" height="380" rx="22" fill="#fff" stroke="#e8c85a" stroke-width="3"/>
  <circle cx="1050" cy="315" r="26" fill="#e8c85a"/><text x="1050" y="323" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
  <text x="1025" y="370" font-family="Figtree, sans-serif" font-size="20" font-weight="700" fill="#1e2a3a">Saved as</text>
  <text x="1025" y="420" font-family="ui-monospace, monospace" font-size="15" fill="#1e2a3a">marc-uuid.jpg</text>
  <text x="1025" y="470" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">Account: broken preview</text>
  <text x="1025" y="540" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">STEP 3 — UI misleads</text>

  <text x="1430" y="460" font-size="36" fill="#1e2a3a">→</text>

  <rect x="1470" y="270" width="390" height="380" rx="22" fill="#fff" stroke="#b89ae0" stroke-width="3"/>
  <circle cx="1520" cy="315" r="26" fill="#b89ae0"/><text x="1520" y="323" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
  <text x="1495" y="370" font-family="Figtree, sans-serif" font-size="20" font-weight="700" fill="#1e2a3a">Proof</text>
  <rect x="1495" y="395" width="340" height="120" rx="10" fill="#14110e"/>
  <text x="1515" y="430" font-family="ui-monospace, monospace" font-size="13" fill="#e8c85a">$ cat uploads/*.jpg</text>
  <text x="1515" y="460" font-family="ui-monospace, monospace" font-size="12" fill="#f6f1e8">&lt;script&gt; … urgent …</text>
  <text x="1495" y="540" font-family="Figtree, sans-serif" font-size="16" fill="#5a6a7a">STEP 4 — junk on web dir</text>

  <rect x="60" y="700" width="1800" height="88" rx="20" fill="#fff8dc" stroke="#e8c85a" stroke-width="2"/>
  <text x="110" y="752" font-family="Figtree, sans-serif" font-size="25" font-weight="700" fill="#1e2a3a">Lesson: add magic-byte checks and re-encode; MIME whitelist alone loses to Burp</text>
</svg>