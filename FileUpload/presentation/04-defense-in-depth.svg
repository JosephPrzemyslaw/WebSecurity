<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <rect width="1200" height="675" fill="#14110e"/>
  <text x="60" y="56" font-family="Figtree, sans-serif" font-size="28" font-weight="700" fill="#f6f1e8">04 — Defense in depth (CWE-434)</text>
  <text x="60" y="88" font-family="Figtree, sans-serif" font-size="16" fill="#8a8175">OWASP · Microsoft file upload guidance · workshop fixes</text>

  <g font-family="Figtree, sans-serif">
    <!-- layers bottom to top -->
    <rect x="200" y="480" width="800" height="70" rx="8" fill="#2a2420" stroke="#8a8175"/>
    <text x="600" y="523" text-anchor="middle" fill="#8a8175" font-size="15">Store outside web root · or dedicated blob storage</text>

    <rect x="230" y="395" width="740" height="70" rx="8" fill="#3d342c" stroke="#e07a3d" stroke-opacity="0.6"/>
    <text x="600" y="438" text-anchor="middle" fill="#f6f1e8" font-size="15">Serve user content from separate domain (no cookies)</text>

    <rect x="260" y="310" width="680" height="70" rx="8" fill="#5c4030" stroke="#e07a3d"/>
    <text x="600" y="353" text-anchor="middle" fill="#f6f1e8" font-size="15">Re-encode images (sharp) · strip EXIF · random server-side names</text>

    <rect x="290" y="225" width="620" height="70" rx="8" fill="#7a4e32" stroke="#f6f1e8" stroke-opacity="0.3"/>
    <text x="600" y="268" text-anchor="middle" fill="#f6f1e8" font-size="15">Magic-byte / file-type check — not browser MIME alone</text>

    <rect x="320" y="140" width="560" height="70" rx="8" fill="#9d2433"/>
    <text x="600" y="183" text-anchor="middle" fill="#f6f1e8" font-size="16" font-weight="600">Allow-list extensions + size limit (lab: USE_SAFE_UPLOAD)</text>
  </g>

  <text x="60" y="620" font-family="Figtree, sans-serif" font-size="14" fill="#8a8175">Avatar UI: &lt;img&gt; only · never execute uploads in the upload directory</text>
</svg>