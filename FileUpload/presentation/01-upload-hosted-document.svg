<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Upload: hostile HTML hosted on shop origin</title>
  <desc id="desc">POST saves evil.html under uploads; GET runs script in the browser on the same origin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e8"/>
      <stop offset="100%" stop-color="#ebe3d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1a1612" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e07a3d"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="56" font-family="Figtree, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1a1612">01 — Hostile file on a trusted origin (client-side impact)</text>
  <text x="60" y="88" font-family="Figtree, Segoe UI, sans-serif" font-size="16" fill="#8a8175">Member shop lab · CWE-434 · not server-side PHP execution</text>

  <!-- Browser column -->
  <text x="120" y="150" font-family="Figtree, sans-serif" font-size="14" font-weight="600" fill="#8a8175">READER BROWSER</text>
  <circle cx="95" cy="144" r="22" fill="#e07a3d" opacity="0.2"/>
  <text x="95" y="150" text-anchor="middle" font-size="16" font-family="Figtree, sans-serif" fill="#e07a3d">☺</text>

  <!-- Step A POST -->
  <g filter="url(#shadow)">
    <rect x="60" y="175" width="420" height="155" rx="12" fill="#fff" stroke="#e4d9c8" stroke-width="2"/>
    <rect x="60" y="175" width="420" height="36" rx="12" fill="#2a2420"/>
    <rect x="60" y="199" width="420" height="12" fill="#2a2420"/>
    <text x="80" y="198" font-family="ui-monospace, monospace" font-size="15" fill="#f6f1e8">POST /account/avatar</text>
    <text x="80" y="248" font-family="ui-monospace, monospace" font-size="14" fill="#9d2433">multipart: evil.html</text>
    <text x="80" y="275" font-family="Figtree, sans-serif" font-size="13" fill="#8a8175">No extension check · original filename kept</text>
    <text x="80" y="308" font-family="Figtree, sans-serif" font-size="13" fill="#1a1612">Avatar UI uses &lt;img&gt; only → no script in preview</text>
  </g>

  <line x1="500" y1="252" x2="600" y2="252" stroke="#e07a3d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Server zone -->
  <rect x="600" y="130" width="540" height="220" rx="16" fill="none" stroke="#e07a3d" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="870" y="162" text-anchor="middle" font-family="Figtree, sans-serif" font-size="15" font-weight="600" fill="#e07a3d">MEMBER SHOP (Node + static)</text>
  <g filter="url(#shadow)">
    <rect x="640" y="185" width="460" height="130" rx="10" fill="#fff" stroke="#e4d9c8"/>
    <text x="660" y="218" font-family="ui-monospace, monospace" font-size="14" fill="#1a1612">HTTP/1.1 302 → /account</text>
    <text x="660" y="248" font-family="ui-monospace, monospace" font-size="14" fill="#2d6a3a">write public/uploads/evil.html</text>
    <text x="660" y="285" font-family="Figtree, sans-serif" font-size="13" fill="#8a8175">Same origin path students will share or open</text>
  </g>

  <!-- Step B GET -->
  <path d="M 270 330 L 270 390 L 270 390" stroke="#e07a3d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="375" font-family="Figtree, sans-serif" font-size="13" fill="#8a8175">Open uploaded file</text>

  <g filter="url(#shadow)">
    <rect x="60" y="400" width="420" height="165" rx="12" fill="#fff" stroke="#e4d9c8" stroke-width="2"/>
    <rect x="60" y="400" width="420" height="36" rx="12" fill="#2a2420"/>
    <text x="80" y="423" font-family="ui-monospace, monospace" font-size="15" fill="#f6f1e8">GET /uploads/evil.html</text>
    <rect x="80" y="448" width="360" height="44" rx="6" fill="#f8e6e4" stroke="#9d2433"/>
    <text x="95" y="476" font-family="Figtree, sans-serif" font-size="14" fill="#9d2433">Urgent banner runs as document on localhost:3005</text>
    <text x="80" y="545" font-family="Figtree, sans-serif" font-size="13" fill="#1a1612">Impact: phishing / XSS-style UI — browser executes JS, not the server</text>
  </g>

  <line x1="500" y1="482" x2="600" y2="482" stroke="#e07a3d" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="640" y="430" width="460" height="120" rx="10" fill="#fff" stroke="#e4d9c8"/>
    <text x="660" y="462" font-family="ui-monospace, monospace" font-size="14" fill="#1a1612">HTTP/1.1 200 · Content-Type: text/html</text>
    <text x="660" y="495" font-family="Figtree, sans-serif" font-size="13" fill="#8a8175">express.static serves bytes · no code interpreter</text>
    <text x="660" y="522" font-family="Figtree, sans-serif" font-size="13" fill="#8a8175">Compare with PHP stacks on your next slide</text>
  </g>
</svg>