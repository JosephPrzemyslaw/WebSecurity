<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library — Member shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="members">
      <section class="panel">
        <p class="eyebrow">Member shop</p>
        <!-- NAV -->
        <h1>Your library</h1>
        <p>Signed-in members can buy books here. One account, one purchase per title.</p>
        <form class="library-search" method="get" action="/members">
          <div class="library-search__row">
            <div class="field library-search__field">
              <label for="q">Search the library</label>
              <input id="q" name="q" maxlength="200" value="__SEARCH_VALUE__" />
            </div>
            <button class="submit search" type="submit">Search</button>
          </div>
        </form>
        <!-- CATALOG -->
        <section class="opinions">
          <h2>Opinions</h2>
          <p>Your note is stored and shown to the next signed-in reader.</p>
          <p class="error" <!-- OPINION_ERROR -->>An opinion is required.</p>
          <form class="opinion-form" method="post" action="/comments">
            <div class="field">
              <label for="body">Opinion</label>
              <textarea id="body" name="body" maxlength="2000" rows="4" required></textarea>
            </div>
            <button class="submit" type="submit">Post opinion</button>
          </form>
          <!-- COMMENTS -->
        </section>
      </section>
    </main>
  </body>
</html>
