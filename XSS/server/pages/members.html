<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Members</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="members">
      <section class="panel">
        <p class="eyebrow">Members</p>
        <h1>Leave a note.</h1>
        <p>Comments stay on this page for everyone who opens it.</p>
        <form method="POST" action="/comments">
          <div class="field">
            <label for="comment">Comment</label>
            <textarea id="comment" name="comment" required></textarea>
          </div>
          <button class="submit" type="submit">Post</button>
        </form>
        <section class="comments">
          <!-- COMMENTS -->
        </section>
      </section>
    </main>
  </body>
</html>
